
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <h2>Student Registration Form</h2>

    <form action="#" method="post">

        <!-- Name -->
        <label for="username">Name:</label>
        <input type="text" id="username" name="username"
               placeholder="Enter your name" value="Sahoo" readonly>
        <br><br>

        <!-- Surname -->
        <label for="surname">Surname:</label>
        <input type="text" id="surname" name="surname"
               placeholder="Enter your surname" required>
        <br><br>
 <!-- Age -->
        <label for="age">Age:</label>
        <input type="number" id="age" name="age"
               placeholder="Enter your age" min="1" max="100">
        <br><br>

        <!-- Gender -->
        Gender:
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other" checked>
        <label for="other">Other</label>
        <br><br>

        <!-- Email -->
        <label for="email">Email ID:</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>
        <br><br>

        <!-- Skills -->
        Skills:
        <input type="checkbox" id="html" name="skills[]" value="HTML & CSS">
        <label for="html">HTML & CSS</label>

        <input type="checkbox" id="js" name="skills[]" value="JavaScript">
        <label for="js">JavaScript</label>

        <input type="checkbox" id="node" name="skills[]" value="Node.js">
        <label for="node">Node.js</label>

        <input type="checkbox" id="java" name="skills[]" value="Java">
        <label for="java">Java</label>

        <input type="checkbox" id="advancedjava" name="skills[]" value="Advanced Java">
        <label for="advancedjava">Advanced Java</label>
        <br><br>

        <!-- Date of Birth -->
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">
        <br><br>

        <!-- Course Selection -->
        <label for="course">Select Course:</label>
        <select name="course" id="course" required>
            <option value="">-- Select a Course --</option>
            <option value="HTML">HTML</option>
            <option value="CSS">CSS</option>
            <option value="JavaScript">JavaScript</option>
            <option value="Java">Java</option>
            <option value=".NET">.NET</option>
        </select>
        <br><br>

        <!-- Buttons -->
        <input type="submit" value="Register">
        <input type="reset" value="Clear">

    </form>

</body>
</html>
