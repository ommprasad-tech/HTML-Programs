<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First HTML Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            line-height: 1.6;
            color: #333;
        }
        button {
            padding: 10px 15px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0052a3;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Webpage</h1>
        <p>This is a simple HTML5 template with basic styling and interactivity.</p>
    </header>

    <hr>

    <main>
        <h2>Key Elements Included</h2>
        <ul>
            <li><strong>Headings &amp; Paragraphs</strong> for structuring text.</li>
            <li><strong>Lists</strong> for organizing bullet points.</li>
            <li><strong>Links</strong> to navigate to external pages.</li>
        </ul>

        <p>Learn more about web standards on <a href="https://developer.mozilla.org/en-US/docs/Web/HTML" target="_blank">MDN Web Docs</a>.</p>

        <button onclick="alert('Hello! You clicked the button.')">Click Me</button>
    </main>

</body>
</html>
