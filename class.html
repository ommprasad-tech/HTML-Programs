
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #101827, #123c65);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.3);
        }

        .icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;
            background: #e5f1ff;
            color: #1769aa;
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }

        h2 {
            text-align: center;
            color: #172b4d;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #26364a;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1.5px solid #dce3ed;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #1976d2;
            box-shadow: 0 0 0 3px rgba(25,118,210,0.12);
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #1976d2, #1253a4);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(25,118,210,0.3);
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 18px;
            background: #effaf3;
            border: 1px solid #b8e8c8;
            border-radius: 12px;
        }

        #result h3 {
            color: #18834a;
            margin-bottom: 12px;
        }

        #result p {
            color: #344054;
            margin: 8px 0;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
            color: #8994a5;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🎓</div>

        <h2>Student Information</h2>
        <p class="subtitle">Enter your details below</p>

        <form id="studentForm">

            <div class="form-group">
                <label for="name">Student Name</label>
                <input type="text" id="name"
                    placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="class">Class</label>
                <input type="text" id="class"
                    placeholder="Enter your class" required>
            </div>

            <div class="form-group">
                <label for="roll">Roll Number</label>
                <input type="number" id="roll"
                    placeholder="Enter your roll number"
                    min="1" step="1" required>
            </div>

            <button type="submit">Submit Details →</button>

        </form>

        <div id="result">
            <h3>✓ Details Submitted!</h3>
            <p><strong>Name:</strong> <span id="showName"></span></p>
            <p><strong>Class:</strong> <span id="showClass"></span></p>
            <p><strong>Roll No:</strong> <span id="showRoll"></span></p>
        </div>

        <div class="footer">
            Student Management System © 2026
        </div>

    </div>

    <script>
        const form = document.getElementById("studentForm");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const studentClass = document.getElementById("class").value.trim();
            const roll = document.getElementById("roll").value;

            if (!name || !studentClass || !roll || Number(roll) < 1) {
                alert("Please enter valid student details!");
                return;
            }

            document.getElementById("showName").textContent = name;
            document.getElementById("showClass").textContent = studentClass;
            document.getElementById("showRoll").textContent = roll;

            document.getElementById("result").style.display = "block";
        });
    </script>

</body>
</html>
